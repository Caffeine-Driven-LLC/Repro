# Repro's own SQLFluff config for the `sqlfluff` detector (sandbox/bin/repro_tools.py). The target's
# .sqlfluff files are ignored (--ignore-local-config). ANSI dialect, and the raw templater: no Jinja
# is rendered, so no macro from the target runs. Layout, capitalisation, and Jinja-padding rules are
# left out; they are formatting, not defects.
[sqlfluff]
dialect = ansi
templater = raw
exclude_rules = layout,capitalisation,jinja
